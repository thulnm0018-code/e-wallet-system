services:

  mysql:
    image: mysql:8.0
    container_name: ewallet-mysql
    restart: always

    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}

    ports:
      - "3306:3306"

    volumes:
      - mysql_data:/var/lib/mysql

    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    restart: always

    ports:
      - "5672:5672"
      - "15672:15672"

  backend:
    build:
      context: ./backend

    container_name: ewallet-backend

    depends_on:
      mysql:
        condition: service_healthy

      rabbitmq:
        condition: service_started

    environment:
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_NAME: ${DB_NAME}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}

      JWT_SECRET: ${JWT_SECRET}
      JWT_ACCESS_EXPIRATION_MS: ${JWT_ACCESS_EXPIRATION_MS}
      JWT_REFRESH_EXPIRATION_MS: ${JWT_REFRESH_EXPIRATION_MS}

      SERVER_PORT: ${SERVER_PORT}

      CLIENT_URL: ${CLIENT_URL}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      MAIL_HOST: ${MAIL_HOST:-}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-}
      MAIL_SMTP_AUTH: ${MAIL_SMTP_AUTH:-true}
      MAIL_SMTP_STARTTLS: ${MAIL_SMTP_STARTTLS:-true}
      MAIL_REQUIRED: ${MAIL_REQUIRED:-true}

      APP_BOOTSTRAP_ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      APP_BOOTSTRAP_ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}

      SPRING_PROFILES_ACTIVE: prod

    ports:
      - "8080:8080"

    volumes:
      - ./backend/uploads:/app/uploads

  frontend:
    build:
      context: ./frontend

    container_name: ewallet-frontend

    depends_on:
      - backend

    ports:
      - "3000:80"

volumes:
  mysql_data:
