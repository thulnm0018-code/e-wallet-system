# DataSource configuration for tests (H2 database)
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# JPA & DDL Auto
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Disable Flyway for test executions
spring.flyway.enabled=false

# JWT configuration for tests
jwt.secret=9a4f2c8d3e7b1a5c6d8e0f2a4b6c8d0e1f3a5b7c9d1e3f5a7b9c1d3e5f7a9b8c
jwt.access-expiration=900000
jwt.refresh-expiration=604800000

# Client Configuration
client.url=http://localhost:3000

# Upload directory used by WebMvcConfig during tests
app.upload.dir=./uploads/avatars

# Server
server.port=8080
