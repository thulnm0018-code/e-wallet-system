# =========================
# DATABASE
# =========================

spring.datasource.url=jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true

spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.datasource.hikari.connection-timeout=60000
spring.datasource.hikari.initialization-fail-timeout=60000

# =========================
# JPA
# =========================

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.open-in-view=false

# =========================
# FLYWAY
# =========================

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# =========================
# JWT
# =========================

jwt.secret=${JWT_SECRET}
jwt.access-expiration=${JWT_ACCESS_EXPIRATION_MS}
jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION_MS}

# =========================
# COOKIES
# =========================

cookie.secure=false
cookie.same-site=Lax

# =========================
# SERVER
# =========================

server.port=${SERVER_PORT:8080}

# =========================
# CLIENT
# =========================

client.url=${CLIENT_URL}

# =========================
# LOGGING
# =========================

logging.level.org.springframework.security=INFO

# =========================
# MAIL
# =========================
# OTP delivery is handled through the application console logs.
# =========================

# =========================
# FILE UPLOAD
# =========================

app.upload.dir=/app/uploads


# =========================
# RABBITMQ
# =========================

spring.rabbitmq.host=rabbitmq
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest