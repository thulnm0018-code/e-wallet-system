# =========================
# DATABASE
# =========================

spring.datasource.url=jdbc:mysql://localhost:3306/ewallet_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true

spring.datasource.username=root
spring.datasource.password=root_password_cua_ban

# =========================
# JPA
# =========================

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.open-in-view=false

# =========================
# FLYWAY
# =========================

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# =========================
# JWT
# =========================

jwt.secret=test-secret-key-for-local-development-at-least-32-characters

jwt.access-expiration=900000
jwt.refresh-expiration=604800000

# =========================
# SERVER
# =========================

server.port=8081

# =========================
# CLIENT
# =========================

client.url=http://localhost:5173

# =========================
# LOGGING
# =========================

logging.level.org.springframework.security=INFO