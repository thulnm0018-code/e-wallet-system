# =========================
# DATABASE
# =========================

spring.datasource.url=jdbc:mysql://localhost:3306/ewallet_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true

spring.datasource.username=root
spring.datasource.password=root_password_cua_ban

# =========================
# JPA
# =========================

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.open-in-view=false

# =========================
# FLYWAY
# =========================

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# =========================
# JWT
# =========================

jwt.secret=test-secret-key-for-local-development-at-least-32-characters

jwt.access-expiration=900000
jwt.refresh-expiration=604800000

# =========================
# SERVER
# =========================

server.port=${SERVER_PORT:8080}

# =========================
# CLIENT
# =========================

client.url=http://localhost:5173

# =========================
# LOGGING
# =========================

logging.level.org.springframework.security=INFO

#=========================
# UPLOAD AVA
#================================

app.upload.dir=./uploads/avatars

#=================================
# RABBITMQ
#=================================

spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

#  ========================
# MAIL
# =========================
# =========================
# MAIL
# =========================

spring.mail.host=smtp-relay.brevo.com
spring.mail.port=587

spring.mail.username=your_brevo_username
spring.mail.password=your_brevo_smtp_key

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true